<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MediaPipe Hands — Pinch Harness</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background:#0b0b0c; color:#eee; }
  .hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.5); padding: 8px 10px; border-radius: 8px; }
  .row { display:flex; gap:10px; align-items:center; margin:4px 0; }
  canvas, video { display:block; width: min(90vw, 800px); height:auto; margin: 24px auto; }
  .pill { padding:2px 8px; border-radius:999px; font-weight:600; }
  .ok { background:#1a3; } .bad { background:#722; } .warn { background:#664; }
  .btns { position: fixed; bottom: 16px; left: 16px; display:flex; gap:8px; }
  button { background:#111; color:#eee; border:1px solid #333; border-radius:8px; padding:8px 12px; cursor:pointer; }
</style>
</head>
<body>

<div class="hud" id="hud">
  <div class="row">FPS: <span id="fps">–</span></div>
  <div class="row">Pinch distance: <span id="dist">–</span></div>
  <div class="row">Pinch state:
    <span id="state" class="pill warn">Idle</span>
  </div>
  <div class="row">Cooldown (ms): <span id="cool">0</span></div>
  <div class="row">Cell (col,row): <span id="cell">–</span></div>
  <div class="row">Model: <span id="model">MediaPipe Hands</span></div>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>

<div class="btns">
  <button id="startBtn">Start</button>
  <button id="stopBtn">Stop</button>
</div>

<script type="module">
import {
  HandLandmarker,
  FilesetResolver,
  DrawingUtils,
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8";

const CFG = {
  width: 640,
  height: 480,
  pinchOn: 0.040,   // try 0.035–0.055
  pinchOff: 0.055,  // hysteresis
  cooldownMs: 220,  // 150–300
  gridCols: 3,
  gridRows: 3,
};

const els = {
  video: document.getElementById("video"),
  canvas: document.getElementById("overlay"),
  fps: document.getElementById("fps"),
  dist: document.getElementById("dist"),
  state: document.getElementById("state"),
  cool: document.getElementById("cool"),
  cell: document.getElementById("cell"),
};

let running = false;
let detector = null;
let ctx = null;
let draw = null;
let lastT = performance.now();
let lastHitAt = 0;
let pinched = false;
let rafId = 0;

function setState(text, cls) {
  els.state.textContent = text;
  els.state.className = "pill " + (cls || "warn");
}

function padFromPoint(x, y, cols, rows) {
  const col = Math.min(cols-1, Math.max(0, Math.floor(x * cols)));
  const row = Math.min(rows-1, Math.max(0, Math.floor(y * rows)));
  return { col, row, idx: row * cols + col };
}

function computePinchDistance(lms) {
  // landmarks normalized [0..1]; use index_tip (8) and thumb_tip (4)
  const a = lms[8], b = lms[4];
  if (!a || !b) return 1;
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.hypot(dx, dy);
}

async function initDetector() {
  const files = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
  );
  detector = await HandLandmarker.createFromOptions(files, {
    baseOptions: {
      // Put your own hosted copy if needed:
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
    },
    numHands: 1,
    runningMode: "VIDEO",
  });
}

async function start() {
  if (running) return;
  await initDetector();
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: CFG.width, height: CFG.height, facingMode: "user" },
    audio: false,
  });
  els.video.srcObject = stream;
  await els.video.play();

  const canvas = els.canvas;
  canvas.width = CFG.width;
  canvas.height = CFG.height;
  ctx = canvas.getContext("2d");
  draw = new DrawingUtils(ctx);

  running = true;
  setState("Listening", "ok");
  lastT = performance.now();
  tick();
}

function stop() {
  running = false;
  cancelAnimationFrame(rafId);
  setState("Stopped", "bad");
  const s = els.video.srcObject;
  if (s) s.getTracks().forEach(t => t.stop());
  els.video.srcObject = null;
}

async function tick() {
  if (!running) return;
  rafId = requestAnimationFrame(tick);

  const now = performance.now();
  const dt = now - lastT;
  lastT = now;
  const fps = Math.round(1000 / Math.max(1, dt));
  els.fps.textContent = String(fps);

  // Draw video to canvas then overlay graphics
  ctx.save();
  ctx.scale(-1, 1); // mirror for selfie view
  ctx.drawImage(els.video, -CFG.width, 0, CFG.width, CFG.height);
  ctx.restore();

  // Grid overlay
  ctx.strokeStyle = "rgba(255,255,255,.2)";
  for (let c=1; c<CFG.gridCols; c++) {
    const x = Math.round((CFG.width * c) / CFG.gridCols);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CFG.height); ctx.stroke();
  }
  for (let r=1; r<CFG.gridRows; r++) {
    const y = Math.round((CFG.height * r) / CFG.gridRows);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CFG.width,y); ctx.stroke();
  }

  // Inference
  const res = await detector.detectForVideo(els.video, now);
  if (res?.landmarks?.length) {
    const lms = res.landmarks[0];

    // Draw landmarks
    draw.drawLandmarks(lms, { radius: 2, color: "#7cf" });

    const d = computePinchDistance(lms);
    els.dist.textContent = d.toFixed(3);

    const idxTip = lms[8];
    // Convert normalized → pixel (mirrored)
    const x = 1 - idxTip.x, y = idxTip.y;
    const px = Math.floor(x * CFG.width), py = Math.floor(y * CFG.height);

    // Highlight fingertip
    ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI*2);
    ctx.fillStyle = "rgba(127,200,255,.6)"; ctx.fill();

    // Map to cell
    const cell = padFromPoint(x, y, CFG.gridCols, CFG.gridRows);
    els.cell.textContent = `${cell.col}, ${cell.row}`;
    // Cell highlight
    const cw = CFG.width / CFG.gridCols, ch = CFG.height / CFG.gridRows;
    ctx.strokeStyle = "rgba(127,200,255,.7)"; ctx.lineWidth = 2;
    ctx.strokeRect(cell.col*cw+2, cell.row*ch+2, cw-4, ch-4);

    // Hysteresis pinch state
    const wasPinched = pinched;
    if (!pinched && d < CFG.pinchOn) pinched = true;
    else if (pinched && d > CFG.pinchOff) pinched = false;

    // Cooldown
    const since = now - lastHitAt;
    const remaining = Math.max(0, CFG.cooldownMs - since);
    els.cool.textContent = Math.round(remaining).toString();

    // Fire on pinch DOWN edge with cooldown
    if (!wasPinched && pinched && since >= CFG.cooldownMs) {
      lastHitAt = now;
      // Visual pulse
      ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2);
      ctx.strokeStyle = "#3fa"; ctx.lineWidth = 4; ctx.stroke();
      // (In your app, trigger the pad here)
    }

    setState(pinched ? "PINCH" : "Listening", pinched ? "ok" : "warn");
  } else {
    setState("No hand", "bad");
  }
}

document.getElementById("startBtn").onclick = start;
document.getElementById("stopBtn").onclick  = stop;
</script>
</body>
</html>
